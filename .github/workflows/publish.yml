name: Publish manuscript

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.9.37'

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::rmarkdown
            any::knitr
            any::gt
            any::webshot2
            any::chromote
            any::patchwork
            any::xml2
          install-quarto: false

      - name: Set up Chrome for table export
        shell: Rscript {0}
        run: |
          chrome <- chromote::chrome_versions_add("latest-stable", "chrome-headless-shell")
          writeLines(paste0("CHROMOTE_CHROME=", chrome), Sys.getenv("GITHUB_ENV"))
          Sys.setenv(CHROMOTE_CHROME = chrome)
          browser <- chromote::ChromoteSession$new()
          browser$close()

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Render manuscript and analysis notebook
        run: quarto render

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _manuscript

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
